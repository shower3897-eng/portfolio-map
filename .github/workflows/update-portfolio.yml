name: Update portfolio at market close

on:
  schedule:
    # 16:45 Asia/Seoul = 07:45 UTC, Monday-Friday
    - cron: "45 7 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_prices.py"
      - ".github/workflows/update-portfolio.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Update portfolio data
        run: python scripts/update_prices.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- data.json; then
            echo "No portfolio data changes."
            exit 0
          fi
          git config user.name "portfolio-map-bot"
          git config user.email "portfolio-map-bot@users.noreply.github.com"
          git add data.json
          git commit -m "Update portfolio close data"
          git push
